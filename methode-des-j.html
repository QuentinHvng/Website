<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Méthode des J — EDN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EE; --surface:#FFF; --ink:#141917; --muted:#5F6E69; --faint:#8A9791;
  --line:#D5DCD8; --line-strong:#B4C0BA;
  --alert:#C0342C; --alert-soft:#F8E6E4; --warn:#B5731A; --warn-soft:#FAEEDC;
  --none:#DCE2DE;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --r:4px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 90px}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,54px);line-height:.92;letter-spacing:-.03em;margin:0}
h1 em{font-style:normal;color:#3E9CA8}
.today{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.today b{display:block;font-family:var(--display);font-weight:700;font-size:24px;color:var(--ink);letter-spacing:-.02em}

.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig{background:var(--surface);padding:13px 15px}
.fig b{display:block;font-family:var(--display);font-weight:700;font-size:27px;line-height:1;letter-spacing:-.02em}
.fig span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.fig.hot b{color:var(--alert)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card-title{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}

.ribbon-card{margin-top:14px}
.ribbon-scroll{overflow-x:auto}
.ribbon{display:flex;align-items:flex-end;gap:2px;height:96px;min-width:100%}
.rib-day{position:relative;flex:1 0 8px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;background:none;border:0;padding:0;cursor:pointer}
.rib-day.week{margin-left:6px}
.rib-day:focus-visible{outline:2px solid #3E9CA8;outline-offset:2px}
.rib-ghost{position:absolute;left:0;right:0;bottom:0;background:var(--line);border-radius:2px}
.rib-stack{position:relative;display:flex;flex-direction:column-reverse;width:100%;border-radius:2px;overflow:hidden}
.rib-seg{width:100%;min-height:1px}
.rib-flag{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--alert)}
.rib-axis{display:flex;gap:2px;min-width:100%;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.rib-tick{flex:1 0 8px;position:relative;height:12px}
.rib-tick.week{margin-left:6px}
.rib-tick b{position:absolute;left:0;top:0;font-weight:500;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}

.tabs{display:flex;gap:2px;margin:22px 0 14px;border-bottom:1px solid var(--line-strong);flex-wrap:wrap}
.tab{font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;margin-bottom:-1px;font-family:var(--body)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:#3E9CA8}
.tab b{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:5px;font-weight:400}
.tab[aria-selected="true"] b{color:#3E9CA8}
.panel[hidden]{display:none}

.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.day.saturated{border-color:var(--alert)}
.day.off{background:transparent;border-style:dashed}
.day.is-today{border-color:#3E9CA8;box-shadow:0 0 0 1px #3E9CA8}
.day-head{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day.off .day-head{border-bottom:0}
.day-date{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.day-date b{color:var(--ink);font-weight:500}
.day-tools{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.gauge{width:64px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;background:#3E9CA8}
.day.saturated .gauge i{background:var(--alert)}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid var(--line-strong);background:none;color:var(--muted);cursor:pointer}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day-badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--alert);background:var(--alert-soft);padding:2px 7px;border-radius:2px}

.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:18px 44px 1fr auto;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--paper)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:16px;height:16px;accent-color:#3E9CA8;cursor:pointer}
.item.done .name,.item.done .act{text-decoration:line-through;color:var(--faint)}
.stage{font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 0;border-radius:2px;text-align:center}
.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.name u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:7px}
.act{font-size:12px;color:var(--muted);text-align:right;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.late{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:2px;white-space:nowrap}
.late.shift{color:var(--warn);background:var(--warn-soft)}
.late.over{color:var(--alert);background:var(--alert-soft)}
.free{padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--faint);border-top:1px dashed var(--line)}
.free button{font:inherit;background:none;border:0;color:#3E9CA8;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.gap{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],input[type=number],input[type=date],select{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:2px;padding:7px 9px}
input[type=text]{min-width:200px;flex:1}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #3E9CA8;outline-offset:1px}
.btn{font-family:var(--body);font-size:13px;font-weight:500;padding:8px 14px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-strong)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:hover:not(:disabled){opacity:.87}

.list{list-style:none;margin:0;padding:0;max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.row{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--paper)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:15px;height:15px;accent-color:#3E9CA8;cursor:pointer}
.row .meta{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}

.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:400}
td.wide{white-space:normal;min-width:200px}
td.num{font-family:var(--mono);font-size:11px;color:var(--faint)}

.cov-group{margin-bottom:16px}
.cov-group h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:400}
.cov-group h4 span{color:var(--faint)}
.squares{display:flex;flex-wrap:wrap;gap:3px}
.sq{width:14px;height:14px;border-radius:2px;border:0;padding:0;cursor:pointer}
.sq:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:16px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.detail{border-left:3px solid #3E9CA8;background:var(--surface);padding:10px 14px;margin-bottom:14px;font-size:13px;border-radius:0 2px 2px 0}
.detail b{font-weight:600}
.detail .chain{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.week-caps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week-caps div{text-align:center}
.week-caps label{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted)}
.week-caps input{width:100%;text-align:center;padding:6px 2px}
.acts{display:grid;gap:6px}
.actrow{display:grid;grid-template-columns:52px 1fr 62px;gap:8px;align-items:center}
.actrow input[type=text]{min-width:0;width:100%}
.actrow input[type=number]{width:100%;text-align:center;padding:6px 4px}
.hint{font-size:12px;color:var(--faint);margin:8px 0 0;line-height:1.55}
.notes{max-height:200px;overflow-y:auto;font-family:var(--mono);font-size:11px;color:var(--muted);border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 12px;border-radius:0 2px 2px 0}
.notes div{padding:1px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:10px 18px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.blank{padding:36px 18px;text-align:center;color:var(--muted);font-size:14px}
.sticky{position:sticky;top:0;background:var(--paper);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}

@media (max-width:700px){
  .wrap{padding:18px 12px 70px}
  .today{text-align:left}
  .item{grid-template-columns:18px 42px 1fr;grid-auto-rows:auto;row-gap:2px}
  .act{grid-column:2/4;grid-row:2;text-align:left;max-width:none;white-space:normal}
  .item .late{grid-column:2/4;grid-row:3;justify-self:start;margin-top:1px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.tabs,.bar,.ribbon-card,.toast,.mini,.free{display:none!important}body{background:#fff}.day{break-inside:avoid}}
</style>
</head>

</div>

<script>
"use strict";

/* ================= échelle des J ================= */

const STAGES = [
  { k:"J0",  off:0,  tol:0, col:"#2B2D5E", fg:"#fff",     act:"Cours + conversion Anki" },
  { k:"J1",  off:1,  tol:0, col:"#354499", fg:"#fff",     act:"/2 ECNi" },
  { k:"J3",  off:3,  tol:1, col:"#3A62AE", fg:"#fff",     act:"1/2 ECNi" },
  { k:"J7",  off:7,  tol:2, col:"#3B81B4", fg:"#fff",     act:"25 Q max ECNi, si moins de 85% alors tout + DP" },
  { k:"J14", off:14, tol:3, col:"#3E9CA8", fg:"#fff",     act:"Annale" },
  { k:"J30", off:30, tol:5, col:"#48AE93", fg:"#fff",     act:"TOUS LES ANKIS / cours" },
  { k:"J45", off:45, tol:6, col:"#6BC079", fg:"#0d1a15",  act:"" },
  { k:"J60", off:60, tol:7, col:"#A9CF63", fg:"#0d1a15",  act:"ECNi 25 questions" }
];
const SI = {}; STAGES.forEach((s,i) => SI[s.k] = i);
const DOW = ["lun","mar","mer","jeu","ven","sam","dim"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

/* ================= dates ================= */

const MS = 86400000;
function today(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); }
function fromIso(s){ return new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10), 12); }
function addDays(d,n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((a-b)/MS); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fr(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function frShort(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); }
function longFr(d){ return DOW[dowIdx(d)]+". "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function dowIdx(d){ return (d.getDay()+6)%7; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function el(id){ return document.getElementById(id); }

/* ================= état ================= */

const RAW = JSON.parse(el("dataset").textContent);
const KEY = "methode-des-j-edn";
let S = null;

function keepScale(d){
  const out = {};
  for(const k in d){ if(k in SI) out[k] = d[k]; }
  return out;
}

function freshState(){
  return {
    v: 1,
    items: RAW.items.map((it,i) => ({
      id: i, num: it.n, nom: it.t, sup: it.s || "", ref: it.r || "Sans collège",
      anki: !!it.a, done: keepScale(it.d), plan: null, off: false
    })),
    acts: STAGES.map(s => s.act),
    tols: STAGES.map(s => s.tol),
    caps: [12,12,12,12,12,8,8],
    capOv: {},
    startIso: iso(today()),
    horizon: 90
  };
}

let STORAGE_OK = true;

async function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ S = JSON.parse(raw); return; }
  }catch(e){
    STORAGE_OK = false;
    console.warn("stockage local indisponible sur cette page :", e);
  }
  S = freshState();
}
async function save(quiet){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    STORAGE_OK = true;
    if(!quiet) toast("Sauvegardé sur cet appareil.");
  }catch(e){
    STORAGE_OK = false;
    if(!quiet) toast("Sauvegarde automatique impossible dans ce navigateur, utilise Sauvegarder dans un fichier.");
  }
}

/* ================= dérivation ================= */

function lastIdx(it){
  let m = -1;
  for(const k in it.done){ if(SI[k] > m) m = SI[k]; }
  return m;
}
function anchor(it){
  if(it.done.J0) return fromIso(it.done.J0);
  if(it.plan) return fromIso(it.plan);
  return null;
}
function nextStage(it){
  const li = lastIdx(it);
  return li >= STAGES.length-1 ? null : li+1;
}
function dueOf(it, si){
  const a = anchor(it);
  if(!a) return null;
  let d = addDays(a, STAGES[si].off);
  const li = lastIdx(it);
  if(li >= 0 && si > li && it.done[STAGES[li].k]){
    const rel = addDays(fromIso(it.done[STAGES[li].k]), STAGES[si].off - STAGES[li].off);
    if(rel > d) d = rel;
  }
  return d;
}

/* La date théorique reste ancrée sur le J0, comme dans ton tableur. Mais après un
   rattrapage tardif, l'intervalle qui sépare deux J est reconduit à partir de la
   date réelle, sinon toute la chaîne d'un item en retard s'écrase sur quelques
   jours et la méthode ne veut plus rien dire. */
function nextDue(anchorD, prevSi, prevDate, si){
  const theo = addDays(anchorD, STAGES[si].off);
  const rel = addDays(prevDate, STAGES[si].off - STAGES[prevSi].off);
  return rel > theo ? rel : theo;
}

function schedule(){
  const start = fromIso(S.startIso);

  // ce qui a déjà été validé un jour donné consomme la capacité de ce jour
  const spent = {};
  S.items.forEach(it => { for(const k in it.done){ spent[it.done[k]] = (spent[it.done[k]]||0) + 1; } });
  const capFor = d => {
    const k = iso(d);
    const base = (k in S.capOv) ? S.capOv[k] : S.caps[dowIdx(d)];
    return Math.max(0, base - (spent[k]||0));
  };

  const deadline = t => addDays(t.due, S.tols[t.si]).getTime();

  // un seul J vivant par item à la fois, le suivant naît quand celui-ci est placé
  let future = [];
  S.items.forEach(it => {
    if(it.off) return;
    const a = anchor(it);
    if(!a) return;
    const li = lastIdx(it);
    if(li >= STAGES.length-1) return;
    const si = li + 1;
    const due = li < 0 ? addDays(a, STAGES[si].off)
                       : nextDue(a, li, fromIso(it.done[STAGES[li].k]), si);
    future.push({ it, si, due, anc:a });
  });

  let queue = [], day = start, guard = 0;
  const days = [], limit = S.horizon + 40;

  while(guard < limit && (future.length || queue.length)){
    guard++;
    const later = [];
    for(const t of future){ if(t.due <= day) queue.push(t); else later.push(t); }
    future = later;

    const cap = capFor(day);
    queue.sort((a,b) => deadline(a) - deadline(b) || a.si - b.si || a.due - b.due || a.it.id - b.it.id);
    const picked = queue.slice(0, cap);
    queue = queue.slice(cap);

    picked.forEach(t => {
      t.day = day;
      t.late = Math.max(0, diffDays(day, t.due));
      t.status = t.late === 0 ? "ok" : (t.late <= S.tols[t.si] ? "shift" : "over");
      const ns = t.si + 1;
      if(ns < STAGES.length){
        future.push({ it:t.it, si:ns, due: nextDue(t.anc, t.si, day, ns), anc:t.anc });
      }
    });

    days.push({ date:day, cap, items:picked, overflow: queue.length, free: Math.max(0, cap - picked.length) });
    day = addDays(day, 1);
  }

  const placed = [], plan = {};
  days.forEach(d => d.items.forEach(t => {
    placed.push(t);
    (plan[t.it.id] = plan[t.it.id] || {})[t.si] = t.day;
  }));
  return { days, placed, plan, remaining: future.length + queue.length };
}

/* ================= vue ================= */

let VIEW = null, TAB = "agenda", DETAIL = null;
const RES = { q:"", sup:"", ref:"", sel:new Set(), date:null };
const RET = { sel:new Set() };

function refresh(persist){
  VIEW = schedule();
  renderHead();
  renderTabs();
  renderAgenda();
  renderRetards();
  renderReserve();
  renderCouverture();
  if(persist !== false) save(true);
}

function overdueItems(){
  const t0 = fromIso(S.startIso);
  const out = [];
  S.items.forEach(it => {
    if(it.off) return;
    const ns = nextStage(it);
    if(ns === null) return;
    const d = dueOf(it, ns);
    if(d && d < t0) out.push({ it, si:ns, due:d, late: diffDays(t0, d) });
  });
  out.sort((a,b) => b.late - a.late);
  return out;
}
function reserveItems(){
  return S.items.filter(it => !it.off && !it.done.J0 && !it.plan);
}
function plannedNotDone(){
  return S.items.filter(it => !it.off && !it.done.J0 && it.plan);
}

function renderHead(){
  const t0 = fromIso(S.startIso);
  el("todayBox").innerHTML = "<b>"+longFr(today())+"</b>"+fr(today());

  const started = S.items.filter(it => it.done.J0).length;
  const finished = S.items.filter(it => lastIdx(it) === STAGES.length-1).length;
  const od = overdueItems().length;
  const doneCount = S.items.reduce((n,it) => n + Object.keys(it.done).length, 0);
  const totalRev = S.items.length * STAGES.length;
  const active = VIEW.days.filter(d => d.items.length);
  const peak = active.length ? Math.max(...active.map(d => d.items.length)) : 0;

  const figs = [
    { v: started+" / "+S.items.length, l:"items démarrés" },
    { v: od, l:"items en retard", hot: od>0 },
    { v: reserveItems().length, l:"items en réserve" },
    { v: doneCount, l:"J validés" },
    { v: (totalRev-doneCount), l:"J restants" },
    { v: peak, l:"pic sur une journée" },
    { v: finished, l:"items bouclés à J60" }
  ];
  el("figures").innerHTML = figs.map(f =>
    '<div class="fig'+(f.hot?" hot":"")+'"><b>'+f.v+'</b><span>'+f.l+'</span></div>').join("");
  renderRibbon();
}

function renderRibbon(){
  const days = VIEW.days.slice(0, S.horizon);
  const scale = Math.max(1, ...days.map(d => Math.max(d.cap, d.items.length)));
  let bars = "", axis = "", lm = -1;
  days.forEach((d,i) => {
    const wk = dowIdx(d.date) === 0 && i > 0 ? " week" : "";
    const segs = d.items.map(t => '<i class="rib-seg" style="height:'+(100/Math.max(1,d.items.length))+'%;background:'+STAGES[t.si].col+'"></i>').join("");
    const flag = d.items.some(t => t.status === "over") ? '<i class="rib-flag"></i>' : "";
    const ttl = longFr(d.date)+" · "+d.items.length+"/"+d.cap+(d.overflow?" · "+d.overflow+" reportés":"");
    bars += '<button class="rib-day'+wk+'" data-j="'+iso(d.date)+'" title="'+esc(ttl)+'">'+
      '<i class="rib-ghost" style="height:'+(100*d.cap/scale)+'%"></i>'+
      '<span class="rib-stack" style="height:'+(100*d.items.length/scale)+'%">'+segs+'</span>'+flag+'</button>';
    const m = d.date.getMonth();
    axis += '<span class="rib-tick'+wk+'">'+(m!==lm?"<b>"+MONTHS[m].slice(0,4)+"</b>":"")+'</span>';
    if(m!==lm) lm = m;
  });
  el("ribbon").innerHTML = bars;
  el("ribAxis").innerHTML = axis;
  el("ribbon").querySelectorAll("[data-j]").forEach(b => b.addEventListener("click", () => {
    setTab("agenda");
    const t = document.querySelector('[data-day="'+b.dataset.j+'"]');
    if(t) t.scrollIntoView({behavior:"smooth", block:"center"});
  }));
}

/* ---------- onglets ---------- */

const TABS = [
  {id:"agenda", n:"Agenda"},
  {id:"retards", n:"Retards"},
  {id:"reserve", n:"Réserve"},
  {id:"couverture", n:"Couverture"},
  {id:"reglages", n:"Réglages"}
];
function renderTabs(){
  const counts = { retards: overdueItems().length, reserve: reserveItems().length, agenda:"", couverture:"", reglages:"" };
  el("tabs").innerHTML = TABS.map(t =>
    '<button class="tab" role="tab" data-t="'+t.id+'" aria-selected="'+(TAB===t.id)+'">'+t.n+
    (counts[t.id] !== "" ? "<b>"+counts[t.id]+"</b>" : "")+'</button>').join("");
  el("tabs").querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.t)));
}
function setTab(id){
  TAB = id;
  TABS.forEach(t => { el("panel-"+t.id).hidden = t.id !== id; });
  el("tabs").querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-selected", b.dataset.t === id));
  if(id === "reglages") renderReglages();
}

/* ---------- agenda ---------- */

function doneOnDate(){
  const map = {};
  S.items.forEach(it => {
    for(const k in it.done){
      const d = it.done[k];
      (map[d] = map[d] || []).push({ it, si:SI[k], doneFlag:true });
    }
  });
  return map;
}

function renderAgenda(){
  const dmap = doneOnDate();
  const days = VIEW.days.slice(0, S.horizon);
  const tIso = iso(today());
  let prev = null, html = "";

  days.forEach(d => {
    const k = iso(d.date);
    const already = (dmap[k] || []);
    if(!d.items.length && !already.length && d.cap > 0) return;
    if(prev){
      const hole = diffDays(d.date, prev) - 1;
      if(hole > 0) html += '<p class="gap">'+hole+" jour"+(hole>1?"s":"")+" sans révision</p>";
    }
    prev = d.date;
    const isOff = S.capOv[k] === 0;
    const pct = d.cap ? Math.min(100, 100*d.items.length/d.cap) : 0;
    const rows = already.concat(d.items).map(t => {
      const s = STAGES[t.si];
      const act = S.acts[t.si] || "";
      let lt = "";
      if(!t.doneFlag && t.status === "over") lt = '<span class="late over">+'+t.late+" j</span>";
      else if(!t.doneFlag && t.status === "shift") lt = '<span class="late shift">+'+t.late+" j</span>";
      return '<li class="item'+(t.doneFlag?" done":"")+'">'+
        '<input type="checkbox" data-id="'+t.it.id+'" data-si="'+t.si+'" data-d="'+k+'"'+(t.doneFlag?" checked":"")+'>'+
        '<span class="stage" style="background:'+s.col+';color:'+s.fg+'">'+s.k+'</span>'+
        '<span class="name"><u>'+esc(t.it.num)+'</u>'+esc(t.it.nom)+'</span>'+
        '<span class="act">'+esc(act)+'</span>'+lt+'</li>';
    }).join("");

    html += '<article class="day'+(d.overflow?" saturated":"")+(isOff?" off":"")+(k===tIso?" is-today":"")+'" data-day="'+k+'">'+
      '<div class="day-head">'+
        '<span class="day-date"><b>'+longFr(d.date)+'</b> '+fr(d.date)+'</span>'+
        (d.overflow?'<span class="day-badge">'+d.overflow+' reporté'+(d.overflow>1?"s":"")+'</span>':'')+
        '<span class="day-tools">'+
          (isOff ? '' : '<span class="gauge"><i style="width:'+pct+'%"></i></span>'+d.items.length+"/"+d.cap)+
          '<button class="mini'+(isOff?" on":"")+'" data-off="'+k+'">'+(isOff?"jour off":"marquer off")+'</button>'+
        '</span>'+
      '</div>'+
      (rows ? '<ul class="items">'+rows+'</ul>' : '') +
      (d.free > 0 ? '<p class="free">'+d.free+' place'+(d.free>1?"s":"")+' libre'+(d.free>1?"s":"")+' · <button data-fill="'+k+'">choisir des items neufs</button></p>' : '')+
      '</article>';
  });

  el("panel-agenda").innerHTML = html || '<div class="blank">Rien de prévu sur cet horizon.</div>';

  el("panel-agenda").querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    const it = S.items[+cb.dataset.id], key = STAGES[+cb.dataset.si].k;
    if(cb.checked) it.done[key] = cb.dataset.d; else delete it.done[key];
    if(key === "J0" && cb.checked) it.plan = null;
    refresh();
  }));
  el("panel-agenda").querySelectorAll("[data-off]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.off;
    if(S.capOv[k] === 0) delete S.capOv[k]; else S.capOv[k] = 0;
    refresh();
  }));
  el("panel-agenda").querySelectorAll("[data-fill]").forEach(b => b.addEventListener("click", () => {
    RES.date = b.dataset.fill;
    setTab("reserve");
    renderReserve();
    window.scrollTo({top:0, behavior:"smooth"});
  }));
}

/* ---------- retards ---------- */

function renderRetards(){
  const od = overdueItems();
  if(!od.length){ el("panel-retards").innerHTML = '<div class="blank">Aucun item en retard. Tout est dans les temps.</div>'; return; }
  const buckets = [["1 à 7 jours",0,7],["8 à 30 jours",8,30],["31 à 90 jours",31,90],["plus de 90 jours",91,1e9]];
  const counts = buckets.map(b => od.filter(o => o.late >= b[1] && o.late <= b[2]).length);

  const rows = od.map(o => {
    const s = STAGES[o.si];
    const li = lastIdx(o.it);
    return '<li class="row">'+
      '<input type="checkbox" data-id="'+o.it.id+'"'+(RET.sel.has(o.it.id)?" checked":"")+'>'+
      '<span class="name"><u>'+esc(o.it.num)+'</u>'+esc(o.it.nom)+'</span>'+
      '<span class="meta">'+(li>=0?STAGES[li].k:"—")+' → <b style="color:'+s.col+'">'+s.k+'</b> · '+frShort(o.due)+' · +'+o.late+' j</span>'+
      '</li>';
  }).join("");

  el("panel-retards").innerHTML =
    '<div class="card"><p class="card-title">Ancienneté du retard</p><div class="figures">'+
      buckets.map((b,i) => '<div class="fig'+(i>=2&&counts[i]?" hot":"")+'"><b>'+counts[i]+'</b><span>'+b[0]+'</span></div>').join("")+
    '</div><p class="hint">Ces items sont déjà réinjectés dans l\'agenda, les plus anciens en premier. Réinitialiser efface les J validés et renvoie l\'item en réserve, ce qui est le geste honnête quand le retard dépasse largement l\'intervalle du J attendu.</p></div>'+
    '<div class="bar"><button class="btn ghost" id="retAll">Tout sélectionner</button>'+
      '<button class="btn ghost" id="retNone">Tout désélectionner</button>'+
      '<button class="btn" id="retReset" disabled>Réinitialiser la sélection</button>'+
      '<span class="meta" id="retCount"></span></div>'+
    '<ul class="list">'+rows+'</ul>';

  const sync = () => {
    el("retCount").textContent = RET.sel.size ? RET.sel.size+" sélectionné(s)" : "";
    el("retReset").disabled = RET.sel.size === 0;
  };
  el("panel-retards").querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    const id = +cb.dataset.id;
    if(cb.checked) RET.sel.add(id); else RET.sel.delete(id);
    sync();
  }));
  el("retAll").addEventListener("click", () => { od.forEach(o => RET.sel.add(o.it.id)); renderRetards(); });
  el("retNone").addEventListener("click", () => { RET.sel.clear(); renderRetards(); });
  el("retReset").addEventListener("click", () => {
    const n = RET.sel.size;
    RET.sel.forEach(id => { S.items[id].done = {}; S.items[id].plan = null; });
    RET.sel.clear();
    refresh();
    toast(n+" item(s) remis en réserve.");
  });
  sync();
}

/* ---------- réserve ---------- */

function renderReserve(){
  const all = reserveItems();
  const sups = [...new Set(S.items.map(i => i.sup).filter(Boolean))].sort();
  const refs = [...new Set(S.items.map(i => i.ref))].sort();
  const q = RES.q.toLowerCase();
  const list = all.filter(it =>
    (!q || (it.nom+" "+it.num).toLowerCase().includes(q)) &&
    (!RES.sup || it.sup === RES.sup) &&
    (!RES.ref || it.ref === RES.ref));

  const pending = plannedNotDone().sort((a,b) => a.plan < b.plan ? -1 : 1);
  const dIso = RES.date || iso(today());
  const dayObj = VIEW.days.find(d => iso(d.date) === dIso);
  const freeTxt = dayObj ? dayObj.free+" place(s) libre(s) le "+fr(fromIso(dIso)) : "jour hors de l'horizon calculé";

  el("panel-reserve").innerHTML =
    '<div class="card"><p class="card-title">Programmer un premier passage</p>'+
      '<div class="bar">'+
        '<input type="date" id="resDate" value="'+dIso+'">'+
        '<button class="btn" id="resGo" disabled>Programmer la sélection</button>'+
        '<span class="meta" id="resInfo">'+esc(freeTxt)+'</span>'+
      '</div>'+
      '<p class="hint">Rien n\'est placé automatiquement. Tu choisis les items et le jour, et toute la chaîne des douze J en découle. Le compteur de places libres tient compte des révisions déjà prévues ce jour là.</p>'+
    '</div>'+
    (pending.length ? '<div class="card"><p class="card-title">Premiers passages programmés, pas encore validés</p><ul class="list" style="max-height:180px">'+
      pending.map(it => '<li class="row"><span></span><span class="name"><u>'+esc(it.num)+'</u>'+esc(it.nom)+'</span>'+
        '<span class="meta">'+fr(fromIso(it.plan))+' · <button class="mini" data-unplan="'+it.id+'">retirer</button></span></li>').join("")+
      '</ul></div>' : '')+
    '<div class="bar">'+
      '<input type="text" id="resQ" placeholder="Chercher un item par nom ou numéro" value="'+esc(RES.q)+'">'+
      '<select id="resSup"><option value="">Tous supports</option>'+sups.map(s => '<option'+(RES.sup===s?" selected":"")+'>'+esc(s)+'</option>').join("")+'</select>'+
      '<select id="resRef"><option value="">Tous collèges</option>'+refs.map(s => '<option'+(RES.ref===s?" selected":"")+'>'+esc(s)+'</option>').join("")+'</select>'+
      '<span class="meta">'+list.length+' / '+all.length+' en réserve</span>'+
    '</div>'+
    '<ul class="list">'+(list.length ? list.map(it =>
      '<li class="row"><input type="checkbox" data-id="'+it.id+'"'+(RES.sel.has(it.id)?" checked":"")+'>'+
      '<span class="name"><u>'+esc(it.num)+'</u>'+esc(it.nom)+'</span>'+
      '<span class="meta">'+esc(it.sup||"—")+' · '+esc(it.ref)+(it.anki?" · Anki":"")+'</span></li>').join("")
      : '<li class="row"><span></span><span class="name">Aucun item ne correspond.</span><span></span></li>')+'</ul>';

  const syncGo = () => {
    const n = RES.sel.size;
    el("resGo").disabled = n === 0;
    el("resGo").textContent = n ? "Programmer "+n+" item"+(n>1?"s":"") : "Programmer la sélection";
  };
  el("resQ").addEventListener("input", e => { RES.q = e.target.value; renderReserve(); el("resQ").focus(); });
  el("resSup").addEventListener("change", e => { RES.sup = e.target.value; renderReserve(); });
  el("resRef").addEventListener("change", e => { RES.ref = e.target.value; renderReserve(); });
  el("resDate").addEventListener("change", e => { RES.date = e.target.value; renderReserve(); });
  el("panel-reserve").querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    const id = +cb.dataset.id;
    if(cb.checked) RES.sel.add(id); else RES.sel.delete(id);
    syncGo();
  }));
  el("panel-reserve").querySelectorAll("[data-unplan]").forEach(b => b.addEventListener("click", () => {
    S.items[+b.dataset.unplan].plan = null; refresh();
  }));
  el("resGo").addEventListener("click", () => {
    const d = el("resDate").value;
    if(!d) return toast("Choisis une date.");
    const n = RES.sel.size;
    RES.sel.forEach(id => { S.items[id].plan = d; });
    RES.sel.clear();
    refresh();
    setTab("agenda");
    toast(n+" premier(s) passage(s) programmé(s) le "+fr(fromIso(d))+".");
  });
  syncGo();
}

/* ---------- couverture ---------- */

function renderCouverture(){
  const groups = {};
  S.items.forEach(it => { (groups[it.ref] = groups[it.ref] || []).push(it); });
  const keys = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
  const perStage = STAGES.map(() => 0);
  let none = 0;
  S.items.forEach(it => { const li = lastIdx(it); if(li < 0) none++; else perStage[li]++; });

  const legend = '<div class="legend"><span><i style="background:var(--none)"></i>pas commencé ('+none+')</span>'+
    STAGES.map((s,i) => perStage[i] ? '<span><i style="background:'+s.col+'"></i>'+s.k+' ('+perStage[i]+')</span>' : "").join("")+'</div>';

  const detail = DETAIL !== null ? (() => {
    const it = S.items[DETAIL];
    const chain = STAGES.map((s,i) => {
      if(it.done[s.k]) return '<span style="color:'+s.col+'">'+s.k+" "+frShort(fromIso(it.done[s.k]))+"</span>";
      const p = VIEW.plan[it.id] && VIEW.plan[it.id][i];
      if(p) return '<span>'+s.k+" prévu "+frShort(p)+"</span>";
      const d = dueOf(it, i);
      return d ? '<span style="color:var(--faint)">'+s.k+" vers "+frShort(d)+"</span>" : '<span style="color:var(--faint)">'+s.k+"</span>";
    }).join("");
    return '<div class="detail"><b>'+esc(it.num)+" — "+esc(it.nom)+'</b><br>'+
      esc(it.sup||"support non renseigné")+" · "+esc(it.ref)+(it.anki?" · Anki fait":"")+
      '<div class="chain">'+chain+'</div></div>';
  })() : "";

  el("panel-couverture").innerHTML = legend + detail + keys.map(k => {
    const g = groups[k].slice().sort((a,b) => lastIdx(b) - lastIdx(a));
    const started = g.filter(i => i.done.J0).length;
    return '<div class="cov-group"><h4>'+esc(k)+' <span>· '+started+"/"+g.length+' démarrés</span></h4><div class="squares">'+
      g.map(it => {
        const li = lastIdx(it);
        const c = li < 0 ? "var(--none)" : STAGES[li].col;
        return '<button class="sq" style="background:'+c+'" data-id="'+it.id+'" title="'+esc(it.num+" "+it.nom+" · "+(li<0?"pas commencé":STAGES[li].k))+'"></button>';
      }).join("")+'</div></div>';
  }).join("");

  el("panel-couverture").querySelectorAll(".sq").forEach(b => b.addEventListener("click", () => {
    DETAIL = DETAIL === +b.dataset.id ? null : +b.dataset.id;
    renderCouverture();
  }));
}

/* ---------- réglages ---------- */

function renderReglages(){
  el("panel-reglages").innerHTML =
    '<div class="card"><p class="card-title">Capacité, en nombre d\'items par jour</p>'+
      '<div class="week-caps">'+DOW.map((d,i) => '<div><label for="c'+i+'">'+d+'</label><input type="number" id="c'+i+'" min="0" max="60" value="'+S.caps[i]+'"></div>').join("")+'</div>'+
      '<div class="grid2" style="margin-top:16px">'+
        '<div><label class="lbl" for="stDate">Départ du planning</label><input type="date" id="stDate" value="'+S.startIso+'" style="width:100%"></div>'+
        '<div><label class="lbl" for="hz">Horizon affiché, en jours</label><input type="number" id="hz" min="14" max="365" value="'+S.horizon+'" style="width:100%"></div>'+
      '</div>'+
      '<p class="hint">Les jours marqués off dans l\'agenda passent devant ces valeurs. Un jour passé sans rien cocher fait simplement remonter ses items au jour suivant.</p>'+
    '</div>'+
    '<div class="card"><p class="card-title">Action et tolérance de retard par J</p><div class="acts">'+
      STAGES.map((s,i) => '<div class="actrow"><span class="stage" style="background:'+s.col+';color:'+s.fg+'">'+s.k+'</span>'+
        '<input type="text" id="a'+i+'" value="'+esc(S.acts[i])+'" placeholder="action à faire pour ce J">'+
        '<input type="number" id="t'+i+'" min="0" max="60" value="'+S.tols[i]+'" title="retard toléré en jours"></div>').join("")+
    '</div><p class="hint">La colonne de droite est le retard toléré en jours. Au delà, la révision reste planifiée mais s\'affiche en rouge.</p></div>'+
    '<div class="card"><p class="card-title">Données</p>'+
      '<div class="bar"><button class="btn" id="doSave">Sauvegarder dans un fichier</button>'+
      '<button class="btn ghost" id="doLoadBtn">Charger un fichier</button>'+
      '<input type="file" id="doLoad" accept=".json" hidden>'+
      '<button class="btn ghost" id="doCsv">Exporter au format du tableur</button>'+
      '<button class="btn ghost" id="doIcs">Exporter vers l\'agenda</button>'+
      '<button class="btn ghost" id="doReset">Repartir des données d\'origine</button></div>'+
      '<p class="hint">Le fichier de sauvegarde contient tout, y compris les J cochés, les premiers passages programmés et les jours off. L\'export tableur reprend la structure de ton classeur.</p>'+
    '</div>'+
    (!STORAGE_OK ? '<div class="card" style="border-color:var(--alert)"><p class="card-title" style="color:var(--alert)">Sauvegarde automatique indisponible</p>'+
      '<p class="hint">Ce navigateur refuse le stockage local sur ce fichier, tes modifications ne survivront pas à la fermeture de la page. Utilise <b>Sauvegarder dans un fichier</b> après chaque session, puis <b>Charger un fichier</b> la fois suivante pour reprendre où tu en étais.</p></div>' : "") +
    (RAW.notes.length ? '<div class="card"><p class="card-title">'+RAW.notes.length+' anomalies relevées à l\'import</p><div class="notes">'+
      RAW.notes.map(n => "<div>"+esc(n)+"</div>").join("")+'</div>'+
      '<p class="hint">Les années 2027 et 2028 ont été lues comme 2026 : les jours et les mois s\'enchaînent correctement en avril 2026, où se trouve déjà le gros de ton activité. Vérifie ces lignes dans ton classeur.</p></div>' : "");

  DOW.forEach((_,i) => el("c"+i).addEventListener("change", e => { S.caps[i] = Math.max(0, +e.target.value||0); refresh(); }));
  STAGES.forEach((_,i) => {
    el("a"+i).addEventListener("input", e => { S.acts[i] = e.target.value; renderAgenda(); save(true); });
    el("t"+i).addEventListener("change", e => { S.tols[i] = Math.max(0, +e.target.value||0); refresh(); });
  });
  el("stDate").addEventListener("change", e => { S.startIso = e.target.value || iso(today()); refresh(); });
  el("hz").addEventListener("change", e => { S.horizon = Math.max(14, +e.target.value||90); refresh(); });

  el("doSave").addEventListener("click", () => dl("methode-des-j.json","application/json",JSON.stringify(S)));
  el("doLoadBtn").addEventListener("click", () => el("doLoad").click());
  el("doLoad").addEventListener("change", e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ S = JSON.parse(r.result); refresh(); renderReglages(); toast("État rechargé."); }catch(err){ toast("Fichier illisible."); } };
    r.readAsText(f);
  });
  el("doCsv").addEventListener("click", exportCsv);
  el("doIcs").addEventListener("click", exportIcs);
  el("doReset").addEventListener("click", () => {
    if(!confirm("Tout ce qui a été coché, programmé ou marqué off sera perdu. Continuer ?")) return;
    S = freshState(); refresh(); renderReglages(); toast("Données d'origine restaurées.");
  });
}

/* ---------- exports ---------- */

function dl(name, mime, content){
  const b = new Blob([content], {type:mime+";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(){
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const head = ["N°ITEM","Nom item","Support","ANKI OK ?"].concat(STAGES.map(s => s.k)).concat(["Collège REF"]);
  const lines = [head.map(q).join(";")];
  S.items.forEach(it => {
    lines.push([q(it.num), q(it.nom), q(it.sup), q(it.anki?"OK":"")]
      .concat(STAGES.map(s => q(it.done[s.k] ? fr(fromIso(it.done[s.k])) : "")))
      .concat([q(it.ref === "Sans collège" ? "" : it.ref)]).join(";"));
  });
  dl("items-et-j.csv","text/csv","\uFEFF"+lines.join("\n"));
  toast("Tableur exporté.");
}
function exportIcs(){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Methode des J//FR","CALSCALE:GREGORIAN"];
  VIEW.days.slice(0, S.horizon).forEach((d,i) => {
    if(!d.items.length) return;
    const desc = d.items.map(t => STAGES[t.si].k+" — "+t.it.num+" "+t.it.nom+(S.acts[t.si]?" — "+S.acts[t.si]:"")).join("\\n");
    out.push("BEGIN:VEVENT","UID:j-"+iso(d.date)+"-"+i+"@methode-des-j","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+iso(d.date).replace(/-/g,""),
      "DTEND;VALUE=DATE:"+iso(addDays(d.date,1)).replace(/-/g,""),
      "SUMMARY:Révisions · "+d.items.length+" item"+(d.items.length>1?"s":""),
      "DESCRIPTION:"+desc,"END:VEVENT");
  });
  out.push("END:VCALENDAR");
  dl("methode-des-j.ics","text/calendar",out.join("\r\n"));
  toast("Fichier .ics téléchargé.");
}

function toast(m){
  const t = el("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ---------- démarrage ---------- */

(async function(){
  await load();
  refresh(false);
  setTab("agenda");
})();
</script>
